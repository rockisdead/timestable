<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Çarpım Tablosu Yarışması</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(135deg,#eaf2ff,#f8f4ff);
    font-family: "Segoe UI", Arial, sans-serif; color: #20304a;
  }
  .game {
    width: min(100%, 520px); background: #fff; border-radius: 24px;
    padding: 26px; box-shadow: 0 16px 45px rgba(35,55,90,.13);
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: clamp(24px,5vw,32px); }
  .sub { color: #55637a; margin: 0 0 18px; }
  .topline { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
    color:#46556d; font-weight:700; font-size:15px; }
  .question { font-size: clamp(44px,12vw,68px); font-weight:800; margin: 14px 0 6px; letter-spacing:1px; }
  .bar { height:12px; background:#e6ebf3; border-radius:99px; overflow:hidden; margin:6px 0 4px; }
  .fill { height:100%; width:100%; background:#e08a25; border-radius:99px; transition:width .1s linear; }
  .fill.low { background:#d64545; }
  .timer { font-size:20px; font-weight:800; color:#9a5a0f; min-height:28px; }
  .answer {
    width:170px; margin:8px auto; padding:6px 10px; font-size:42px; font-weight:800;
    border:3px solid #dce3ee; border-radius:14px; min-height:68px; letter-spacing:4px;
  }
  .answer.empty { color:#aab4c4; }
  .answer.shake { animation: shake .35s; border-color:#d64545; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .feedback { min-height:30px; margin:6px 0; font-size:18px; font-weight:700; }
  .score { font-size:18px; font-weight:800; color:#1f6b4b; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:330px; margin:12px auto 0; }
  button {
    border:0; border-radius:14px; background:#356ae6; color:#fff; font-size:17px; font-weight:700;
    cursor:pointer; min-height:48px; padding:12px 24px; touch-action:manipulation;
  }
  button:hover { background:#2858c7; }
  button:focus-visible { outline:3px solid #20304a; outline-offset:2px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .pad button { font-size:28px; min-height:62px; padding:0; background:#eef3ff; color:#20304a; border:2px solid #cdd9f5; }
  .pad button:hover:not(:disabled) { background:#dbe6ff; }
  .pad button:active:not(:disabled) { transform:scale(.95); }
  .pad .back { background:#fff1e0; border-color:#f2d3a8; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .alt { background:#fff; color:#356ae6; border:2px solid #356ae6; }
  .alt:hover { background:#eef3ff; }
  .cont { margin-top:6px; background:#287a57; }
  .cont:hover { background:#1f6b4b; }
  .missed { text-align:left; background:#fff7ec; border-radius:14px; padding:12px 16px; margin:12px 0; }
  .missed b { display:block; margin-bottom:4px; }
  .best { color:#55637a; font-size:15px; margin-top:12px; }
  .tlabel { margin:14px 0 4px; font-weight:700; }
  .tables { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .chip { min-height:48px; min-width:48px; padding:0; font-size:22px; background:#fff; color:#20304a; border:2px solid #cdd9f5; }
  .chip:hover { background:#eef3ff; }
  .chip[aria-pressed="true"] { background:#356ae6; color:#fff; border-color:#356ae6; }
  .chip[aria-pressed="true"]:hover { background:#2858c7; }
  .alt.small { min-height:36px; padding:6px 14px; font-size:14px; margin-top:4px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:-8px 0 4px; }
  #soundBtn { margin-left:auto; }
  .snd { min-height:36px; padding:6px 12px; font-size:14px; background:#fff; color:#356ae6; border:2px solid #cdd9f5; }
  .snd:hover { background:#eef3ff; }
  .hidden { display:none !important; }
  .help { color:#5f6b7e; font-size:13px; margin-top:16px; }
  @media (prefers-reduced-motion: reduce) { .fill{transition:none} .answer.shake{animation:none} }
  @media (max-width:420px) { .game {padding:20px 14px;} }
</style>
</head>
<body>
<main class="game">
  <div class="toolbar">
    <button id="homeBtn" class="snd hidden" type="button" aria-label="Ana sayfa">🏠</button>
    <button id="soundBtn" class="snd" type="button" aria-pressed="true">🔊 Ses açık</button>
  </div>
  <h1>⭐ Çarpım Tablosu Yarışması</h1>
  <p class="sub">Çarpma şampiyonu olmaya hazır mısın?</p>

  <section id="startScreen">
    <div class="question">7 × 8 = ?</div>
    <p>10 soru, her doğru cevap 10 puan.<br>Yanlış yaptığın sorular ikinci bir deneme için geri gelir.</p>
    <p class="tlabel">Çalışmak istediğin tabloları seç:</p>
    <div class="tables" id="tables" role="group" aria-label="Çarpım tablolarını seç"></div>
    <p class="best" id="tablesHint"></p>
    <button id="clearTables" class="alt small hidden" type="button">Seçimi temizle</button>
    <div class="row">
      <button id="startBtn">Oyunu başlat (her soru 10 saniye)</button>
    </div>
    <p class="best" id="bestStart"></p>
  </section>

  <section id="playScreen" class="hidden">
    <div class="topline">
      <span id="progress">Soru 1 / 10</span>
      <span id="streak"></span>
      <span id="scoreTop">Puan: 0</span>
    </div>
    <div class="question" id="question">7 × 8 = ?</div>
    <div id="timerWrap">
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="timer" id="timer">10</div>
    </div>
    <div class="answer empty" id="answer" role="status" aria-label="Cevabın">?</div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <button id="contBtn" class="cont hidden">Devam</button>
    <div class="pad" id="pad" role="group" aria-label="Rakam tuşları"></div>
  </section>

  <section id="endScreen" class="hidden">
    <div class="question" id="finalScore">0 / 100</div>
    <p id="finalMessage">Güzel çaba!</p>
    <div class="missed hidden" id="missedBox"><b>Şunları tekrar çalış:</b><span id="missedList"></span></div>
    <p class="best" id="bestEnd"></p>
    <div class="row">
      <button id="againBtn">Tekrar oyna</button>
    </div>
  </section>
</main>

    if (timed) {
      startTime = Date.now();
      $("fill").style.width = "100%"; $("fill").classList.remove("low");
      $("timer").textContent = SECONDS;
      timerId = setInterval(() => {
        const left = SECONDS * 1000 - (Date.now() - startTime);
        if (left <= 0) { $("fill").style.width = "0%"; timeUp(); return; }
        $("fill").style.width = (left / (SECONDS * 1000) * 100) + "%";
        $("fill").classList.toggle("low", left <= 3000);
        $("timer").textContent = Math.ceil(left / 1000);
      }, 100);
      scheduleCountdown(qid);
    }
  }

  function press(d) {
    if (!active || typed.length >= String(a * b).length) return;
    typed += d; renderAnswer();
    if (typed.length === String(a * b).length) {
      active = false; setPad(false); stopCountdown();
      checkId = setTimeout(check, 250);
    }
  }
  function back() {
    if (!active) return;
    typed = typed.slice(0, -1); renderAnswer();
  }

  function check() {
    if (Number(typed) === a * b) return correct();
    if (phase === "retry") return retryAgain();
    wrong("Olmadı!");
  }
  function correct() {
    active = false; cancelTimers(); setPad(false);
    if (phase === "main") {
      score += POINTS; streak++; updateScore();
      $("feedback").textContent = "Doğru! +10 puan 🎉";
      play("correct");
    } else {
      $("feedback").textContent = "Evet, doğru! 🎉";
      play("correct", 0.6);
    }
    $("feedback").style.color = "#1f6b4b";
    advanceId = setTimeout(nextQuestion, 900);
  }
  function wrong(message, delay = 0) {
    active = false; cancelTimers(); setPad(false);
    streak = 0; updateScore();
    missed.push([a, b]); play("incorrect", 1, delay);
    $("timerWrap").classList.add("hidden");
    $("feedback").textContent = `${message} ${a} × ${b} = ${a * b}`;
    $("feedback").style.color = "#9a4a07";
    $("contBtn").classList.remove("hidden");
    $("contBtn").focus();
  }
  function timeUp() { if (active) wrong("Süre doldu!", 0.55); }
  function retryAgain() {
    attempts++; play("incorrect");
    $("answer").classList.remove("shake"); void $("answer").offsetWidth;
    $("answer").classList.add("shake");
    $("feedback").textContent = attempts >= 2
      ? `Cevap ${a * b}. Şimdi sen yaz.` : "Olmadı. Tekrar dene!";
    $("feedback").style.color = "#9a4a07";
    typed = ""; renderAnswer(); active = true; setPad(true);
  }

  function finishGame() {
    cancelTimers(); active = false; show("endScreen");
    $("finalScore").textContent = `${score} / 100`;
    $("finalMessage").textContent =
      score === 100 ? "Mükemmel puan! Harika iş çıkardın!" :
      score >= 70 ? "Çok iyi! Çalışmaya devam et!" :
      score >= 40 ? "Güzel çaba. Gittikçe daha iyi oluyorsun!" :
      "Çalışmaya devam et, yapabilirsin!";
    const box = $("missedBox");
    if (missed.length) {
      $("missedList").innerHTML = missed.map(([x, y]) => `<div>${x} × ${y} = ${x * y}</div>`).join("");
      box.classList.remove("hidden");
    } else box.classList.add("hidden");
    let note = "";
    if (mode === "timed") {
      if (score > best()) { saveBest(score); note = score > 0 ? "🏆 Yeni en yüksek puan!" : ""; }
      else note = `En yüksek puan: ${best()} / 100`;
    }
    $("bestEnd").textContent = note;
    showBest();
  }

  // physical keyboard still works
  document.addEventListener("keydown", e => {
    if ($("playScreen").classList.contains("hidden") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") back();
  });

  const tablesBox = $("tables");
  for (let t = MIN; t <= MAX; t++) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "chip"; btn.textContent = t;
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", `${t} çarpım tablosu`);
    btn.addEventListener("click", () => {
      if (selected.has(t)) selected.delete(t); else selected.add(t);
      renderTables();
    });
    tablesBox.appendChild(btn);
  }
  function renderTables() {
    tablesBox.querySelectorAll(".chip").forEach((btn, i) => btn.setAttribute("aria-pressed", String(selected.has(MIN + i))));
    const picked = [...selected].sort((x, y) => x - y);
    $("tablesHint").textContent = picked.length
      ? `Çalışılan tablo: ${picked.join(", ")}`
      : `Seçim yok: ${MIN} ile ${MAX} arasındaki tüm tablolar`;
    $("clearTables").classList.toggle("hidden", !picked.length);
  }
  $("clearTables").addEventListener("click", () => { selected.clear(); renderTables(); });
  renderTables();

  $("startBtn").addEventListener("click", () => startGame("timed"));
  $("againBtn").addEventListener("click", () => startGame("timed"));
  $("contBtn").addEventListener("click", nextQuestion);
  $("homeBtn").addEventListener("click", () => {
    cancelTimers(); stopAllSounds(); active = false; qid++;
    show("startScreen"); showBest();
  });
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("ttcSound", soundOn ? "1" : "0"); } catch (e) {}
    renderSound();
    if (!soundOn) stopAllSounds();
  });
  renderSound();
  showBest();
})();
</script>
</body>
</html>
